# Source repo build & release workflow (TEMPLATE)
#
# Pre-filled copies for each of the 11 source repos are in
# templates/per-source/<source>.build.yml — use those, not this file.
#
# This template:
#   1. Builds a release APK with the configured applicationId.
#   2. Signs it with the Android debug keystore (swap for production keystore — see docs/add-new-extension.md).
#   3. Emits a metadata.json sidecar.
#   4. Creates a GitHub Release with the .apk and metadata.json as assets.
#
# Triggers:
#   - workflow_dispatch (manual) with optional version bump
#   - tag push matching v*

name: Build & Release Extension

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, none]
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # === EDIT FOR EACH SOURCE REPO ===
  EXTENSION_NAME: Atsumaru
  PACKAGE_NAME: com.blissless.atsumaru.manga
  CONTENT_TYPE: manga
  LANGUAGE: en
  # =================================

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Locate gradle build file
        id: gf
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "file=app/build.gradle.kts" >> $GITHUB_OUTPUT
          elif [ -f app/build.gradle ]; then
            echo "file=app/build.gradle" >> $GITHUB_OUTPUT
          else
            echo "ERROR: no app/build.gradle(.kts) found" >&2
            exit 1
          fi

      - name: Determine version
        id: ver
        env:
          GRADLE_FILE: ${{ steps.gf.outputs.file }}
        run: |
          VERSION_NAME=$(grep -E 'versionName' "$GRADLE_FILE" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode' "$GRADLE_FILE" | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          [ -z "$VERSION_NAME" ] && VERSION_NAME="1.0.0"
          [ -z "$VERSION_CODE" ] && VERSION_CODE=1
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        id: sign
        env:
          BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
        run: |
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -z "$UNSIGNED" ] && { echo "No APK found"; exit 1; }
          FINAL_NAME="${PACKAGE_NAME}-v${{ steps.ver.outputs.version_name }}.apk"
          OUT="app/build/outputs/apk/release/$FINAL_NAME"
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$BUILD_TOOLS/apksigner" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT" "$UNSIGNED"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
          echo "apk_path=$OUT" >> $GITHUB_OUTPUT
          echo "apk_name=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Emit metadata.json sidecar
        env:
          VC: ${{ steps.ver.outputs.version_code }}
          VN: ${{ steps.ver.outputs.version_name }}
        run: |
          cat > metadata.json <<EOF
          {
            "name": "${EXTENSION_NAME}",
            "package": "${PACKAGE_NAME}",
            "contentType": "${CONTENT_TYPE}",
            "delivery": "${DELIVERY}",
            "language": "${LANGUAGE}",
            "versionCode": ${VC},
            "versionName": "${VN}",
            "nsfw": false,
            "sources": [
              { "name": "${EXTENSION_NAME}", "lang": "${LANGUAGE}", "id": 1 }
            ]
          }
          EOF
          cat metadata.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ env.EXTENSION_NAME }} ${{ steps.ver.outputs.version_name }}
          generate_release_notes: true
          files: |
            ${{ steps.sign.outputs.apk_path }}
            metadata.json
